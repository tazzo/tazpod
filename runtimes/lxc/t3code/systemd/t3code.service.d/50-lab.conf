# 50-lab.conf — lab drop-in for the *user* service `t3code.service`.
#
# Rendered by install-t3code.sh into
#   ~/.config/systemd/user/t3code.service.d/50-lab.conf
# (placeholders @T3_USER@, @T3_USER_HOME@, @NODE_BIN_DIR@ are substituted there).
#
# Why this file exists at all, three facts measured against the shipped unit
# (apps/server/src/cloud/bootService.ts, renderBootServiceUnit):
#   * the unit sets no PATH — the user manager's PATH has no ~/.local/bin, and
#     opencode/pi are symlinked there, so without the line below T3 Code cannot
#     find a single provider on this container;
#   * the unit sets no TMPDIR — `t3 doctor` needs temp space for a full copy of
#     the database, and /tmp lives on the same filesystem as / here anyway;
#   * the unit has no guard for a runtime file left behind by an unclean
#     container restart, which is the "already running" trap in the operator's
#     guide.
#
# The resource cap is NOT here: it is on the slice, see systemd/app-t3code.slice.
# That matters, because T3 Code puts every agent in its own scope inside
# `app-t3code-agents.slice` and sets that child slice's limits *at runtime*
# (`systemctl --user set-property --runtime ...`), which overrides a static file
# for that unit. Capping the parent covers both the server and the agents.

[Service]
# Put the server and the agent scopes under one cap: adding only `MemoryMax=`
# here would leave every agent outside the accounting.
Slice=app-t3code.slice

# Provider CLIs must be on the service's PATH; the service reads no shell rc.
Environment=PATH=@T3_USER_HOME@/.local/bin:@NODE_BIN_DIR@:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin

# Same filesystem as ~/.t3 so `t3 doctor`'s temporary database copy has room.
Environment=TMPDIR=@T3_USER_HOME@/.t3/tmp

# Clean a stale runtime file (pid no longer alive) before the launcher decides
# a server is already running. See clean-stale-runtime.sh.
ExecStartPre=-/usr/local/lib/t3code/clean-stale-runtime.sh
