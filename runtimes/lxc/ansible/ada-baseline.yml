---
# Ada — the durable agent house.
#
# The container is created by terraform-ada; this playbook only configures what is
# inside it: system packages, Node 24, the `ada` service user, the code directory,
# the environment file rendered from gopass at deploy time, and the systemd unit.
#
# Secrets are passed as extra-vars by ada-create.sh and are never written to git.
- name: Configure the Ada container
  hosts: ada
  become: true
  roles:
    - ada
