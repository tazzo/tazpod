---
ada_user: ada
ada_group: ada
ada_root: /opt/ada
# The data lives on the pet volume owned by CT 998, not on the container disk.
ada_home: /home/ada
ada_app: "{{ ada_root }}/app"
ada_node_major: "24"
ada_http_bind: "0.0.0.0"
ada_http_port: 7801

# Filled by ada-create.sh from gopass. Empty by default so the role can run in
# check mode without secrets.
ada_opencode_api_key: ""
ada_exa_api_key: ""
ada_http_token: ""

# SSH access: the public key installed in gopass (infra/ada/ssh/public) and the
# root password (infra/ada/ssh/password). Never the private key.
ada_ssh_public_key: ""
ada_ssh_password_hash: ""

# The mail channel (AgentMail): the key comes from gopass at deploy time. The
# operator's address is the only one whose messages are commands.
ada_agentmail_api_key: ""
ada_mail_operator: "roberto.tazzoli@gmail.com"
ada_mail_poll_seconds: 30
