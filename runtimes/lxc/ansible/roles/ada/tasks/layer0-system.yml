---
- name: Base packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - ca-certificates
      - curl
      - git
      - jq
      - sudo
      - ripgrep
      - fd-find
      - build-essential
      - python3
      - unzip
      - tmux
      - htop
      - ncdu
      - sqlite3
      - age
      - rsync
    state: present

- name: Timezone
  ansible.builtin.timezone:
    name: Europe/Rome

# The module points /etc/localtime at the zone but leaves the Debian image's
# /etc/timezone saying Etc/UTC. Anything that reads that file (rather than
# /etc/localtime) then disagrees with `timedatectl` by an hour. Idempotent on
# purpose: it rewrites only when the content differs.
- name: Timezone file agrees with the zone
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "Europe/Rome\n"
    owner: root
    group: root
    mode: "0644"
