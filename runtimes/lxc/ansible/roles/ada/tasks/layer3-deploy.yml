---
# A recreated container has the code copied in by ada-create.sh but no dependencies;
# install them here so the role alone can bring the service up.
- name: Is node_modules present?
  ansible.builtin.stat:
    path: "{{ ada_app }}/node_modules"
  register: ada_node_modules

- name: Install the engine's dependencies
  ansible.builtin.command:
    cmd: npm ci --omit=dev
    chdir: "{{ ada_app }}"
  become_user: "{{ ada_user }}"
  environment:
    HOME: "{{ ada_home }}"
  when: not ada_node_modules.stat.exists

- name: Configuration directory
  ansible.builtin.file:
    path: /etc/ada
    state: directory
    owner: root
    group: "{{ ada_group }}"
    mode: "0750"

- name: Environment file (secrets, rendered from gopass at deploy time)
  ansible.builtin.template:
    src: env.j2
    dest: /etc/ada/env
    owner: "{{ ada_user }}"
    group: "{{ ada_group }}"
    mode: "0600"
  no_log: true
  notify: restart ada

- name: systemd unit
  ansible.builtin.template:
    src: ada.service.j2
    dest: /etc/systemd/system/ada.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart ada

# A failed first start (for example before npm ci ran) leaves a start limit behind;
# a redeploy must be able to start the unit again.
- name: Clear the start limit before starting
  ansible.builtin.command: systemctl reset-failed ada
  changed_when: false
  failed_when: false

- name: Enable and start ada
  ansible.builtin.systemd:
    name: ada
    enabled: true
    state: started
    daemon_reload: true
