---
# A recreated container has the code copied in by ada-create.sh but no dependencies;
# install them here so the role alone can bring the service up.
# Git belongs to the agent: it commits and pushes its own work.
- name: Git identity for the service user
  ansible.builtin.command:
    cmd: "git config --global --replace-all {{ item.key }} {{ item.value | quote }}"
  become_user: "{{ ada_user }}"
  environment:
    HOME: "{{ ada_home }}"
  loop:
    - { key: user.name, value: "Ada" }
    - { key: user.email, value: "ada-bot@agentmail.to" }
  changed_when: false

- name: Is node_modules present?
  ansible.builtin.stat:
    path: "{{ ada_app }}/node_modules"
  register: ada_node_modules

- name: Install the engine's dependencies
  ansible.builtin.command:
    cmd: npm ci --omit=dev
    chdir: "{{ ada_app }}"
  become_user: "{{ ada_user }}"
  environment:
    HOME: "{{ ada_home }}"
  when: not ada_node_modules.stat.exists

- name: Configuration directory
  ansible.builtin.file:
    path: /etc/ada
    state: directory
    owner: root
    group: "{{ ada_group }}"
    mode: "0750"

# The secrets live encrypted in the agent's home; this wrapper decrypts the ones it
# needs into its own environment and then execs the engine. Nothing is written.
- name: Secrets wrapper
  ansible.builtin.template:
    src: secrets-exec.sh.j2
    dest: /usr/local/bin/ada-secrets-exec
    owner: root
    group: root
    mode: "0755"
  notify: restart ada

- name: One-secret helper
  ansible.builtin.template:
    src: ada-secret.sh.j2
    dest: /usr/local/bin/ada-secret
    owner: root
    group: root
    mode: "0755"

# The secrets are no longer rendered into an environment file: they live encrypted
# in the agent's home and the wrapper decrypts them at start. A deploy that finds no
# identity must fail loudly, not start an engine without credentials.
- name: The encrypted secrets must be there
  ansible.builtin.find:
    paths: "{{ ada_home }}/.secrets"
    patterns: "*.age"
  register: ada_secrets_files

- name: Refuse to start an engine with no secrets at all
  ansible.builtin.assert:
    that:
      - ada_secrets_files.matched > 0
    fail_msg: "no *.age in {{ ada_home }}/.secrets: run ada-secrets-init.sh first."

- name: Environment file (configuration only, no secrets)
  ansible.builtin.template:
    src: env.j2
    dest: /etc/ada/env
    owner: "{{ ada_user }}"
    group: "{{ ada_group }}"
    mode: "0600"
  no_log: true
  notify: restart ada

- name: systemd unit
  ansible.builtin.template:
    src: ada.service.j2
    dest: /etc/systemd/system/ada.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart ada

# A failed first start (for example before npm ci ran) leaves a start limit behind;
# a redeploy must be able to start the unit again.
- name: Clear the start limit before starting
  ansible.builtin.command: systemctl reset-failed ada
  changed_when: false
  failed_when: false

- name: Enable and start ada
  ansible.builtin.systemd:
    name: ada
    enabled: true
    state: started
    daemon_reload: true
