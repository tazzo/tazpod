---
# Role defaults — override in the playbook or with -e

# Folder that contains all workspace repos (tazpod, SKILLS, ephemeral-castle, ...).
# Derived from the playbook location, so it works both from a normal checkout and
# from inside TazPod where the pet volume is mounted at /workspace.
# Override with: -e tazpod_workspace=/workspace
tazpod_workspace: "{{ playbook_dir }}/../../../.."

# Client machines whose SSH public keys are authorized on the container for root
# and tazpod (public half read from infra/ssh-client-keys/<name>/id_ed25519.pub in
# the secrets checkout). Keep in sync with admin_key_names in create.sh phase 2b.
tazpod_admin_key_names:
  - desktop
  - macbook-fedora

# Password for the `tazpod` user is intentionally NOT stored in the repository.
# NOTE: there is no gopass entry for it today (the path this comment used to cite,
# `infra/tazpod-proxmox/user-password`, was never created). Pass one only when you
# deliberately want to set it; leaving it empty keeps whatever the account has.
# For a *required* secret, prefer reading gopass inside the role
# (`delegate_to: localhost` + `no_log: true`, as in tazpod-deploy.yml) over `-e`,
# which puts the value in argv and in any logged command line.
tazpod_user_password: ""

# ─── Paperclip (project paperclip-lxc-deployment) ───────────────────────────
# Managed (npm) install pinned to a version; state lives on the pet volume so a
# container rebuild does not rotate secrets/master.key. Secrets are read from
# gopass by the layer itself (never passed with -e).
paperclip_version: "2026.916.1"
paperclip_user: paperclip
paperclip_uid: 1001
paperclip_instance_id: default
paperclip_home: /workspace/.paperclip
paperclip_port: 3100
paperclip_bind_host: "192.168.1.206"
paperclip_host: "0.0.0.0"
paperclip_public_url: "http://192.168.1.206:3100"
paperclip_allowed_hostnames: "192.168.1.206"
paperclip_deployment_mode: authenticated
paperclip_deployment_exposure: private
paperclip_bind: lan
paperclip_db_host: "192.168.1.211"
paperclip_db_port: 32227
paperclip_db_name: paperclip
paperclip_db_user: paperclip
paperclip_db_pool_max: 10
paperclip_gopass_db_password: infra/paperclip/db-password
paperclip_gopass_better_auth_secret: infra/paperclip/better-auth-secret
paperclip_gopass_tool_action_secret: infra/paperclip/tool-action-signing-secret
paperclip_gopass_agent_jwt_secret: infra/paperclip/agent-jwt-secret
# `pi` (the agent CLI used by the `pi_local` adapter) runs on OpenCode Go with the
# DeepSeek Flash model; the API key is read from gopass and exported into the
# service environment, so the agent inherits it without any secret on disk.
paperclip_gopass_opencode_key: infra/paperclip/opencode-key
pi_version: "0.86.1"
# `onboard --yes` always starts the server in the foreground and has no "save only"
# switch, so the first-run onboarding is bounded by this timeout (seconds); the
# systemd unit owns the server lifetime afterwards.
paperclip_onboard_timeout: 240
