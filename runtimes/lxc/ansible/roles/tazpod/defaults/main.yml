---
# Role defaults — override in the playbook or with -e

# Folder that contains all workspace repos (tazpod, SKILLS, ephemeral-castle, ...).
# Derived from the playbook location, so it works both from a normal checkout and
# from inside TazPod where the pet volume is mounted at /workspace.
# Override with: -e tazpod_workspace=/workspace
tazpod_workspace: "{{ playbook_dir }}/../../../.."

# Client machines whose SSH public keys are authorized on the container for root
# and tazpod (public half read from infra/ssh-client-keys/<name>/id_ed25519.pub in
# the secrets checkout). Keep in sync with admin_key_names in create.sh phase 2b.
tazpod_admin_key_names:
  - desktop
  - macbook-fedora

# Password for the `tazpod` user is intentionally NOT stored in the repository.
# NOTE: there is no gopass entry for it today (the path this comment used to cite,
# `infra/tazpod-proxmox/user-password`, was never created). Pass one only when you
# deliberately want to set it; leaving it empty keeps whatever the account has.
# For a *required* secret, prefer reading gopass inside the role
# (`delegate_to: localhost` + `no_log: true`, as in tazpod-deploy.yml) over `-e`,
# which puts the value in argv and in any logged command line.
tazpod_user_password: ""

# ─── pi (layer4b-pi) ────────────────────────────────────────────────────────
# One pinned `pi` CLI, system-wide, installed by layer4b-pi.yml. The operator
# keeps it after Paperclip's decommission (2026-10-19).
pi_version: "1.3.0"

# ─── Multica (project multica-agent-orchestration, phase 3: the daemon) ─────
# The daemon is the *runtime* of the control plane: it discovers the agent CLIs
# installed for this user, registers them as runtimes and executes the tasks the
# control plane hands it. It is a plain user process — the upstream guide says
# explicitly "not inside Docker" — it needs no root and it sandboxes nothing: the
# boundary is the operating-system account, which is why it runs as `tazpod`, the
# same deliberate trade the operator runtime documents (the agents it spawns inherit
# exactly the operator environment).
#
# Install shape: a *pinned release binary* from the upstream GitHub release, installed
# system-wide in /usr/local/bin (like `omp` in layer4) and verified against the sha256
# the same release publishes in `checksums.txt`. The layer owns the update — bump
# `multica_version` + `multica_cli_sha256` together, re-run, and the handler restarts
# the unit — while the daemon's own update/reload pollers are switched off in the unit
# (see `multica.env.j2`: under systemd a self-spawned successor outlives the unit).
multica_version: "0.5.3"
multica_cli_sha256: "4ed222cc829d89ac318a3707df34f6754b08df02357939036d0a5bab5e494d92"
multica_release_base_url: "https://github.com/multica-ai/multica/releases/download"
multica_cli_bin: /usr/local/bin/multica
# Scratch space for the release tarball and its single-member extraction (the tarball
# also carries LICENSE/NOTICE/README, which must not land in /usr/local/bin).
multica_extract_dir: "/tmp/multica-cli-{{ multica_version }}"
multica_user: tazpod
multica_user_home: "/home/{{ multica_user }}"
# The PATH the daemon discovers the agent CLIs on. `omp` is a native binary in
# /usr/local/bin; `pi` and `opencode` are npm installs under ~/.local/bin whose
# shebang is `#!/usr/bin/env node`, so node must be on this PATH as well — which is
# how this container already exposes it (/usr/local/bin/node, symlinked to nvm by
# tazpod-deploy, with /usr/bin/node from layer5 as the other candidate).
multica_path: "/home/{{ multica_user }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
# Labels for the server's Runtimes view; the daemon id stays the hostname.
multica_device_name: tazpod-proxmox
multica_runtime_name: "CT106 (TazPod)"
# The control plane (this project's phase 2, Kubernetes) exposes only the *frontend*,
# on a LAN address: the Next.js app proxies /v1, /api, /auth, /uploads and /ws to the
# backend at runtime, so one same-origin URL serves both the REST API and the
# WebSocket the daemon holds open. No port 80/443 on that VIP is free (occupied by the
# lab's other surfaces) and no `*.tazlab.net` name is involved: those resolve from the
# public DNS wildcard and are forbidden for this app.
multica_server_url: "http://192.168.1.240:3000"
multica_app_url: "{{ multica_server_url }}"
# Dedicated workspace root, on the pet volume: the daemon must never be handed the
# operator's checkouts (it creates one isolated directory per task and keeps a shared
# bare-clone cache under `.repos/`, which is expensive to re-clone after a rebuild).
multica_workspaces_root: /workspace/.multica/workspaces
# The container is 2 cores / 8 GiB shared with the operator's interactive agents, so the
# upstream default of 20 concurrent runs is not a resource plan; the watchdogs are
# declared explicitly rather than left to the built-in defaults.
multica_max_concurrent_tasks: 4
multica_poll_interval: 30s
multica_heartbeat_interval: 15s
multica_agent_idle_watchdog: 2h
multica_env_dir: /etc/multica
multica_env_file: "{{ multica_env_dir }}/multica.env"
multica_unit_path: /etc/systemd/system/multica-daemon.service
multica_cli_config_path: "{{ multica_user_home }}/.multica/config.json"
# The daemon token: a personal access token (`mul_...`, 90 days) minted against the
# control plane (UI → Settings → tokens, or the headless flow in the wiki page) **for the
# operator account**, `roberto.tazzoli@gmail.com` — not for a lab/service account. The
# daemon registers its runtimes under the token's user, and that user owns everything
# registered through this machine: the runtime rows, every agent bound to them, and the
# runtime's MCP inventory, which only the owner (or a runtime flipped to `public`) may
# read (`server/internal/handler/runtime.go`, `canUseRuntimeForAgent`). Minted for a lab
# account instead, the operator sees an empty default tab on the Agents page and a
# permission refusal in an agent's MCP section, with nothing on the host actually broken.
# The token is the only secret this layer gates on, it lives in gopass, and it never
# travels in argv — see the layer header for where it is rendered and why there. The
# daemon keeps it alive itself (`POST /api/tokens/current/renew`, ~3-day cadence against a
# server-side 7-day threshold, extending `expires_at` in place), so the gopass entry is
# written once and not rotated while the daemon runs.
multica_gopass_token: infra/multica/daemon-token
# Web search for the agent CLIs the daemon spawns. `omp` reads EXA_API_KEY natively and
# the operator's shell exports the same key from this same entry (dotfiles/.bashrc);
# a systemd unit inherits no shell environment, so without this line the daemon-spawned
# agents would silently lose the search tool the interactive ones have.
multica_gopass_exa_key: infra/exa/api-key
# The model provider the daemon-spawned agent CLIs authenticate with. `pi` and `omp`
# both route to the lab's `opencode-go` provider and read `OPENCODE_API_KEY` from the
# environment — `pi`'s own `auth.json` is empty and `omp`'s `agent/config.yml` names
# `opencode-go/deepseek-v4.1-flash`, so the key is not optional: without it every task
# the daemon claims fails at the CLI handshake. It lives under `infra/multica/` since
# 2026-10-19, when the Paperclip namespace was decommissioned and its key moved here
# (the value is unchanged); the provider credential stays in gopass and never lands in
# the Multica database.
multica_gopass_opencode_key: infra/multica/opencode-key

# ─── Multica agent team (layer7-multica-team) ───────────────────────────────
# The team — the shared skills and the agents — is declared in Git next to the layer that
# applies it, and reconciled onto the control plane by a script rather than by a sequence of
# `command` tasks: deciding idempotence there means *comparing* the roster against live
# state field by field, which is a differ's job, not a template's. The roster itself
# (`configs/multica-team/roster.yml`) is the source of truth and carries its own rationale.
multica_team_config_dir: "{{ role_path }}/../../../configs/multica-team"
multica_team_script: "{{ role_path }}/../../../scripts/multica-team-apply.py"
# Named in the failure message when the script is missing, so the operator is told which
# checkout the layer expects rather than just that a path was empty.
multica_team_checkout_hint: "runtimes/lxc of the tazpod repository"
# Staged under /etc/multica beside the daemon environment file: it is the layer's declared
# input, and it doubles as the record of the last roster that was applied to this host.
multica_team_staging_dir: "{{ multica_env_dir }}/team"
# `git` reads this path in addition to ~/.gitconfig, with no environment variable, and the
# daemon passes HOME through to every agent it spawns — which is what gives the Release
# agent a forge credential without a token on a command line. See `multica.gitconfig.j2`.
multica_team_gitconfig_path: "{{ multica_user_home }}/.config/git/config"
# The forge token the rendered credential helper reads at push time. It is never rendered
# into any file: only the path appears in `multica.gitconfig.j2`.
multica_gopass_github_token: cluster/github/token
