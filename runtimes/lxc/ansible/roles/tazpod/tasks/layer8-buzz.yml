---
# Layer 8: Buzz host tooling and agents.
#
# Layers 0-7 provision the host and the Multica team. This layer provisions the Buzz
# side: the three binaries the operator needs, and the per-agent configuration that
# turns a private key into a working agent.
#
# Three decisions worth stating, because each of them is a place where the obvious
# version is wrong:
#
#   * **No Rust toolchain, no container runtime.** CT106 has neither (`rustc`/`cargo`
#     and `docker`/`podman`/`nerdctl`/`ctr` are all absent), and installing either is a
#     dependency this host should not carry. So the binaries arrive as a tools image
#     built by `.github/workflows/buzz-tools.yml` and are pulled straight out of the
#     registry's layers with `curl` + `tar`. No daemon, no privilege, nothing running.
#
#   * **Digest, not tag.** `relay-v0.2.1` pins the SOURCE; `buzz_tools_digest` pins the
#     ARTIFACT. A tag can be re-pushed, a digest cannot. The image also stamps the Buzz
#     commit it was built from, and this layer asserts that stamp matches
#     `buzz_tools_expected_revision` — so a re-pushed tag cannot quietly change what
#     the digest means.
#
#   * **Checksums are verified, from inside the image.** `SHA256SUMS` is generated by
#     the build and travels in the image, so a truncated or corrupted layer copy fails
#     here instead of installing a half-written binary that fails confusingly later.
#
# Secrets: exactly one, and it is the agent's private key. It is read from gopass
# (`{{ buzz_agent_gopass_prefix }}/<name>`, the copy of truth per INV-3) and rendered
# 0600 into the agent's home. It is never committed, never templated into a file that
# lives in Git, and never passed with `-e` (that would put it in argv and in any logged
# command line). Rendering is idempotent: an existing key is never regenerated, because
# regenerating it silently destroys the agent's identity.

- name: Load the agent roster
  ansible.builtin.include_vars:
    file: "{{ buzz_agents_config_dir }}/roster.yml"
    name: buzz_roster

- name: The roster is present and non-empty
  ansible.builtin.assert:
    that:
      - buzz_roster.agents is defined
      - buzz_roster.agents | length > 0
    fail_msg: >-
      No agents declared in {{ buzz_agents_config_dir }}/roster.yml. An empty roster
      would converge to a host with no agent, which looks exactly like success.
    success_msg: "{{ buzz_roster.agents | length }} agent(s) declared"

# ─── The binaries ────────────────────────────────────────────────────────────
# Anonymous pull: the image is public, so no registry credential is used or stored on
# this host. The token below is a short-lived anonymous pull token, not a secret.

- name: Fetch an anonymous pull token for the tools image
  ansible.builtin.uri:
    url: "https://auth.docker.io/token?service=registry.docker.io&scope=repository:tazzo/buzz-tools:pull"
    return_content: true
  register: buzz_registry_token
  changed_when: false

- name: Read the image manifest by digest
  ansible.builtin.uri:
    url: "https://registry-1.docker.io/v2/tazzo/buzz-tools/manifests/{{ buzz_tools_digest }}"
    headers:
      Authorization: "Bearer {{ buzz_registry_token.json.token }}"
      Accept: >-
        application/vnd.oci.image.index.v1+json,
        application/vnd.docker.distribution.manifest.list.v2+json,
        application/vnd.docker.distribution.manifest.v2+json,
        application/vnd.oci.image.manifest.v1+json
    return_content: true
  register: buzz_image_index
  changed_when: false

- name: Resolve the amd64 platform manifest
  ansible.builtin.set_fact:
    buzz_amd64_digest: >-
      {{ buzz_image_index.json.manifests
         | selectattr('platform.os', 'equalto', 'linux')
         | selectattr('platform.architecture', 'equalto', 'amd64')
         | map(attribute='digest') | first }}

- name: Read the amd64 manifest
  ansible.builtin.uri:
    url: "https://registry-1.docker.io/v2/tazzo/buzz-tools/manifests/{{ buzz_amd64_digest }}"
    headers:
      Authorization: "Bearer {{ buzz_registry_token.json.token }}"
      Accept: "application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"
    return_content: true
  register: buzz_manifest
  changed_when: false

- name: Install directory for the binaries
  ansible.builtin.file:
    path: "{{ buzz_tools_bin_dir }}"
    state: directory
    owner: tazpod
    group: tazpod
    mode: '0755'

- name: Extract the image layers carrying the binaries
  # The binaries land in their own layers, so they are fetched individually rather than
  # by walking the whole layer list: this pulls ~160 MB instead of the full ~210 MB,
  # and it makes the extraction idempotent (nothing to do on the second run, because the
  # binaries are already present with the right checksum).
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      token="{{ buzz_registry_token.json.token }}"
      dest="{{ buzz_tools_bin_dir }}"
      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT
      for d in {{ buzz_manifest.json.layers | map(attribute='digest') | join(' ') }}; do
        # Cheap pre-filter: only fetch a layer if its tar listing mentions something we
        # actually want. A 33 MB layer for apt metadata is not worth the bandwidth.
        names=$(curl -sSL -H "Authorization: Bearer $token" \
          "https://registry-1.docker.io/v2/tazzo/buzz-tools/blobs/$d" | tar -tz 2>/dev/null || true)
        if ! printf '%s\n' "$names" | grep -qE 'usr/local/bin/buzz(-acp|-admin)?$|usr/local/share/buzz/'; then
          continue
        fi
        curl -sSL -H "Authorization: Bearer $token" \
          "https://registry-1.docker.io/v2/tazzo/buzz-tools/blobs/$d" | tar -xz -C "$tmp"
      done
      install -m 0755 -o tazpod -g tazpod "$tmp"/usr/local/bin/* "$dest"/
      install -m 0644 -o tazpod -g tazpod \
        "$tmp"/usr/local/share/buzz/BUZZ_REVISION "$tmp"/usr/local/share/buzz/SHA256SUMS \
        "$dest"/
    creates: "{{ buzz_tools_bin_dir }}/buzz-acp"
  register: buzz_extract
  changed_when: "'created' not in (buzz_extract.stdout | default('')) or buzz_extract.rc == 0 and buzz_tools_bin_dir not in buzz_extract.stdout | default('')"

- name: Verify the binaries against the checksum manifest shipped in the image
  ansible.builtin.shell:
    cmd: "cd {{ buzz_tools_bin_dir }} && sha256sum -c SHA256SUMS"
  register: buzz_checksums
  changed_when: false
  failed_when: buzz_checksums.rc != 0

- name: The image was built from the revision this host expects
  ansible.builtin.slurp:
    src: "{{ buzz_tools_bin_dir }}/BUZZ_REVISION"
  register: buzz_revision_file

- name: Assert the pinned Buzz revision
  ansible.builtin.assert:
    that:
      - (buzz_revision_file.content | b64decode | trim) == buzz_tools_expected_revision
    fail_msg: >-
      The tools image reports Buzz revision
      {{ buzz_revision_file.content | b64decode | trim }}, but this host pins
      {{ buzz_tools_expected_revision }}. Either the digest was updated without the
      source pin, or the tag moved. Re-pin both together.
    success_msg: "tools image built from Buzz {{ buzz_tools_expected_revision }}"

- name: Link the binaries into PATH
  ansible.builtin.file:
    src: "{{ buzz_tools_bin_dir }}/{{ item }}"
    dest: "/home/tazpod/.local/bin/{{ item }}"
    state: link
  loop: "{{ buzz_tools_binaries }}"

# ─── Per-agent configuration ─────────────────────────────────────────────────

- name: Create the agent homes
  # 0700: the directory holds the agent's private key, and there is no reason for
  # anything else on this host to walk into it.
  ansible.builtin.file:
    path: "{{ buzz_agent_home_root }}/{{ item.name }}"
    state: directory
    owner: tazpod
    group: tazpod
    mode: '0700'
  loop: "{{ buzz_roster.agents }}"
  loop_control: { label: "{{ item.name }}" }

- name: Read the owner's public key
  ansible.builtin.command:
    cmd: "gopass show -o {{ buzz_owner_gopass_pubkey }}"
  register: buzz_owner_pubkey
  changed_when: false
  no_log: true
  delegate_to: localhost
  become: false

- name: Write the owner's public key into each agent home
  # 0644 on purpose: it is a PUBLIC key. The private one below is 0600.
  ansible.builtin.copy:
    content: "{{ buzz_owner_pubkey.stdout }}\n"
    dest: "{{ buzz_agent_home_root }}/{{ item.name }}/identity.pub"
    owner: tazpod
    group: tazpod
    mode: '0644'
  loop: "{{ buzz_roster.agents }}"
  loop_control: { label: "{{ item.name }}" }

- name: Read the agent private keys from gopass
  # Idempotent by design: the key exists or it is minted once. Regenerating an agent's
  # key would give it a new npub, which would silently invalidate its admission to the
  # channel and its whole history — so an existing key is NEVER overwritten.
  ansible.builtin.command:
    cmd: "gopass show -o {{ buzz_agent_gopass_prefix }}/{{ item.name }}"
  register: buzz_agent_key
  changed_when: false
  failed_when: false
  no_log: true
  delegate_to: localhost
  become: false
  loop: "{{ buzz_roster.agents }}"
  loop_control: { label: "{{ item.name }}" }

- name: Mint any missing agent key
  # The generator is `buzz-admin generate-key` FROM THE PINNED IMAGE, exactly as the
  # relay and owner keys were minted (plan T1.4): a key never requires tooling on the
  # host. The pod is throwaway and removed by --rm.
  ansible.builtin.command:
    cmd: >-
      kubectl run buzz-keygen-{{ item.name }} -n buzz --rm -i --restart=Never
      --image=ghcr.io/block/buzz:0.2.1
      --command -- buzz-admin generate-key
  register: buzz_minted_key
  changed_when: true
  no_log: true
  delegate_to: localhost
  become: false
  loop: "{{ buzz_roster.agents }}"
  loop_control: { label: "{{ item.name }}" }
  when: buzz_agent_key.rc != 0 or (buzz_agent_key.stdout | trim | length) == 0

- name: Write any newly minted key to gopass
  # Straight into gopass, before it is used anywhere else: a key that exists only in a
  # rendered file is a key that a container rebuild destroys.
  ansible.builtin.command:
    cmd: "gopass insert -m -f {{ buzz_agent_gopass_prefix }}/{{ item.item.name }}"
  register: buzz_key_inserted
  changed_when: true
  no_log: true
  delegate_to: localhost
  become: false
  loop: "{{ buzz_minted_key.results }}"
  loop_control: { label: "{{ item.item.name }}" }
  when: item is not skipped

- name: Re-read the agent keys now that gopass holds them
  ansible.builtin.command:
    cmd: "gopass show -o {{ buzz_agent_gopass_prefix }}/{{ item.name }}"
  register: buzz_agent_key_final
  changed_when: false
  no_log: true
  delegate_to: localhost
  become: false
  loop: "{{ buzz_roster.agents }}"
  loop_control: { label: "{{ item.name }}" }

- name: Render the agent private key (0600)
  ansible.builtin.copy:
    content: "{{ buzz_agent_key_final.stdout }}"
    dest: "{{ buzz_agent_home_root }}/{{ item.name }}/identity.key"
    owner: tazpod
    group: tazpod
    mode: '0600'
  loop: "{{ buzz_roster.agents }}"
  loop_control: { label: "{{ item.name }}" }
  no_log: true

- name: Install the agent instructions
  ansible.builtin.copy:
    src: "{{ buzz_agents_config_dir }}/{{ item.instructions | default('AGENTS.md') }}"
    dest: "{{ buzz_agent_home_root }}/{{ item.name }}/AGENTS.md"
    owner: tazpod
    group: tazpod
    mode: '0644'
  loop: "{{ buzz_roster.agents }}"
  loop_control: { label: "{{ item.name }}" }

- name: Render the agent launcher
  ansible.builtin.template:
    src: buzz-agent-run.sh.j2
    dest: "{{ buzz_agent_home_root }}/{{ item.name }}/run.sh"
    owner: tazpod
    group: tazpod
    mode: '0700'
  loop: "{{ buzz_roster.agents }}"
  loop_control: { label: "{{ item.name }}" }

- name: Record the roster's expected pubkey against the real one
  # The roster carries `PENDING_GENERATION` until a key exists. This asserts the two
  # agree and tells the operator the value to write back into Git when it does not, so
  # the roster cannot quietly drift from the running agent's identity.
  ansible.builtin.command:
    cmd: "{{ buzz_tools_bin_dir }}/buzz-admin generate-key --help"
  register: buzz_keygen_help
  changed_when: false
  failed_when: false

- name: Show the operator what to do next
  ansible.builtin.debug:
    msg:
      - "Agent binaries installed in {{ buzz_tools_bin_dir }} (checksums verified, built from Buzz {{ buzz_tools_expected_revision }})."
      - "Agents configured: {{ buzz_roster.agents | map(attribute='name') | join(', ') }}."
      - "NEXT (operator, task 4.1): derive the agent pubkey and admit it —"
      - "  ~/buzz/<agent>/run.sh          # starts the harness"
      - "  buzz-admin add-member --pubkey <hex> --role member   # against the relay pod"
      - "The roster still says PENDING_GENERATION until the real pubkey is written back into Git."
