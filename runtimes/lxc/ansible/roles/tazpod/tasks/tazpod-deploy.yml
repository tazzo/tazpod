---
# TazPod deploy: binary, KUBECONFIG, dotfiles, systemd, nvim, tree-sitter, Tailscale

- name: Config directories
  file: { path: "/home/tazpod/.config/{{ item }}", owner: tazpod, group: tazpod, state: directory }
  loop: [starship, zellij, nvim]

- name: Locate the locally built tazpod binary (repo root artifact from `task build`)
  delegate_to: localhost
  become: false
  stat: { path: "{{ tazpod_workspace }}/tazpod/tazpod" }
  register: tazpod_artifact
  changed_when: false

- name: TazPod binary
  copy:
    src: "{{ tazpod_workspace }}/tazpod/tazpod"
    dest: /home/tazpod/.local/bin/tazpod
    owner: tazpod
    group: tazpod
    mode: '0755'
  when: tazpod_artifact.stat.exists

- name: Warn when the tazpod binary artifact is missing
  debug:
    msg: "tazpod binary not built — run `task build` in the tazpod repo root (create.sh does it automatically); skipping binary install"
  when: not tazpod_artifact.stat.exists

- name: KUBECONFIG directory
  file: { path: /home/tazpod/.kube, owner: tazpod, group: tazpod, state: directory }

- name: Locate kubeconfig in the workspace checkout
  delegate_to: localhost
  become: false
  stat: { path: "{{ tazpod_workspace }}/ephemeral-castle/clusters/tazlab-k8s/proxmox/configs/kubeconfig" }
  register: kubeconfig_src
  changed_when: false

- name: Read kubeconfig from gopass (controller, only when the checkout copy is absent)
  delegate_to: localhost
  become: false
  command: gopass show k8s/kubeconfig
  register: kubeconfig_gopass
  changed_when: false
  failed_when: false
  no_log: true
  when: not kubeconfig_src.stat.exists

- name: KUBECONFIG (from the workspace checkout)
  copy:
    src: "{{ tazpod_workspace }}/ephemeral-castle/clusters/tazlab-k8s/proxmox/configs/kubeconfig"
    dest: /home/tazpod/.kube/config
    owner: tazpod
    group: tazpod
    mode: '0600'
  when: kubeconfig_src.stat.exists

- name: KUBECONFIG (from gopass)
  copy:
    content: "{{ kubeconfig_gopass.stdout | default('') }}"
    dest: /home/tazpod/.kube/config
    owner: tazpod
    group: tazpod
    mode: '0600'
  no_log: true
  when:
    - not kubeconfig_src.stat.exists
    - kubeconfig_gopass.stdout | default('') | length > 0

- name: Warn when no kubeconfig source is available
  debug:
    msg: "no kubeconfig found (workspace checkout and gopass both empty) — skipping; cluster access will be unavailable in the container"
  when:
    - not kubeconfig_src.stat.exists
    - kubeconfig_gopass.stdout | default('') | length == 0

- name: Dotfiles (bashrc + tmux)
  copy: { src: "{{ item }}", dest: "/home/tazpod/{{ item | basename }}", owner: tazpod, group: tazpod, mode: '0644' }
  loop:
    - "{{ tazpod_workspace }}/tazpod/dotfiles/.bashrc"
    - "{{ tazpod_workspace }}/tazpod/dotfiles/.tmux.conf"

- name: TPM (Tmux Plugin Manager)
  git:
    repo: https://github.com/tmux-plugins/tpm
    dest: /home/tazpod/.tmux/plugins/tpm
    version: master
    depth: 1
  become_user: tazpod

- name: Neovim init.lua + lazyvim.json
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: tazpod
    group: tazpod
    mode: '0644'
  loop:
    - { src: "{{ tazpod_workspace }}/tazpod/dotfiles/.config/nvim/init.lua", dest: /home/tazpod/.config/nvim/init.lua }
    - { src: "{{ tazpod_workspace }}/tazpod/dotfiles/.config/nvim/lazyvim.json", dest: /home/tazpod/.config/nvim/lazyvim.json }

- name: Neovim lua directory
  file: { path: /home/tazpod/.config/nvim/lua, owner: tazpod, group: tazpod, state: directory }

- name: Neovim lua plugins config
  copy:
    src: "{{ tazpod_workspace }}/tazpod/dotfiles/.config/nvim/lua/"
    dest: /home/tazpod/.config/nvim/lua/
    owner: tazpod
    group: tazpod

- name: Starship config
  copy: { src: "{{ tazpod_workspace }}/tazpod/dotfiles/.config/starship.toml", dest: /home/tazpod/.config/starship.toml, owner: tazpod, group: tazpod, mode: '0644' }

- name: Zellij config
  copy: { src: "{{ tazpod_workspace }}/tazpod/dotfiles/.config/zellij/config.kdl", dest: /home/tazpod/.config/zellij/config.kdl, owner: tazpod, group: tazpod, mode: '0644' }

- name: Start/update scripts
  copy: { src: "{{ item }}", dest: "/home/tazpod/{{ item | basename }}", owner: tazpod, group: tazpod, mode: '0755' }
  loop:
    - "{{ tazpod_workspace }}/SKILLS/tools/tailscale/start-lxc.sh"
    - "{{ tazpod_workspace }}/SKILLS/tools/tailscale/update-hosts.sh"

- name: Systemd units
  template: { src: "{{ item }}.j2", dest: "/etc/systemd/system/{{ item }}" }
  loop: [tazpod-gro-gso-fix.service, tazpod-update-hosts.service, tazpod-update-hosts.timer]

- name: Enable systemd
  systemd: { name: "{{ item }}", enabled: yes, state: started, daemon_reload: yes }
  loop: [tazpod-gro-gso-fix.service, tazpod-update-hosts.timer]

- name: batcat symlink
  file: { src: /usr/bin/batcat, dest: /usr/local/bin/bat, state: link }

- name: node/npm symlinks in /usr/local/bin
  become_user: tazpod
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
    sudo ln -sf "$(which node)" /usr/local/bin/node
    sudo ln -sf "$(which npm)" /usr/local/bin/npm
  args: { creates: /usr/local/bin/node }

- name: Systemd DNS
  shell: |
    if command -v resolvectl &>/dev/null; then
      resolvectl dns eth0 1.1.1.1 8.8.8.8 || true
    fi
  changed_when: false


- name: Starship Tokyo Night config (LXC theme)
  template:
    src: starship-tokyo-night.toml.j2
    dest: /home/tazpod/.config/starship-tokyo.toml
    owner: tazpod
    group: tazpod
    mode: '0644'
- name: nvim LazyVim plugins sync
  become_user: tazpod
  shell: |
    export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
    nvim --headless "+Lazy! sync" +qa 2>&1
  args: { creates: /home/tazpod/.local/share/nvim/lazy/LazyVim }

- name: Tailscale secrets directory
  file: { path: /home/tazpod/secrets, owner: tazpod, group: tazpod, state: directory, mode: '0700' }


- name: Check tree-sitter CLI
  become_user: tazpod
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
    command -v tree-sitter >/dev/null 2>&1
  register: tree_sitter_check
  changed_when: false
  failed_when: false

- name: tree-sitter CLI (nvim-treesitter)
  become_user: tazpod
  shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
    npm install -g tree-sitter-cli@0.24.7 2>&1 | tail -3
  when: tree_sitter_check.rc != 0


- name: Verifica Tailscale connesso
  become_user: tazpod
  shell: |
    if ! tailscale status 2>&1 | grep -q 'tazpod'; then
      cd /home/tazpod && bash start-lxc.sh 2>&1
    else
      echo 'Tailscale already connected'
    fi
  changed_when: false

# ─── Legacy cleanup (2026-09-10) ───────────────────────────────────────────
# Remote access to the old dsh Web UI used an SSH loopback tunnel (the sync
# daemon was decommissioned in project 30 — its unit pointed at a binary that no
# longer exists and restart-looped forever). The dsh Web UI itself was
# decommissioned on 2026-09-25 (project `paperclip-lxc-deployment`): the layer,
# the unit and the tunnel tooling are gone. nginx is still removed here because a
# reverse proxy for a loopback-only UI must never come back.

- name: Ensure nginx reverse proxy is not installed
  apt:
    name: nginx
    state: absent
    purge: yes

- name: Remove legacy tazpod-sync systemd unit
  file:
    path: "/etc/systemd/system/tazpod-sync.service"
    state: absent

- name: Reload systemd after legacy unit removal
  systemd:
    daemon_reload: yes

- name: Workspace tools dirs (pet volume, prima creazione)
  file: { path: "/workspace/.tazpod/{{ item }}", owner: tazpod, group: tazpod, state: directory }
  loop: [.omp, .gemini, .antigravity, .antigravitycli, .claude, .herdr, .opencode, .aws, .ssh, vault, keyrings]

# NOTE: `.pi` is deliberately NOT managed here. It used to be symlinked to the pet
# volume from this task, which raced layer4 (which installs the pi extensions into a
# real `~/.pi` before this file runs). It is now owned by the Paperclip layer
# (`layer5-paperclip.yml` / `paperclip-pi-home.yml`), so there is a single writer.
#
# NOTE: .ssh is deliberately NOT symlinked to the pet volume: layer0 injects the
# authorized_keys into the real /home/tazpod/.ssh directory, and Ansible refuses
# (correctly) to replace a directory holding live keys with a symlink.
- name: Home symlinks to workspace tools
  file: { src: "/workspace/.tazpod/{{ item.src }}", dest: "/home/tazpod/{{ item.dest }}", owner: tazpod, group: tazpod, state: link }
  loop:
    - { src: .omp, dest: .omp }
    - { src: .gemini, dest: .gemini }
    - { src: .antigravity, dest: .antigravity }
    - { src: .antigravitycli, dest: .antigravitycli }
    - { src: .claude, dest: .claude }
    - { src: .herdr, dest: .herdr }
    - { src: .opencode, dest: .opencode }
    - { src: .aws, dest: .aws }

- name: .ssh secure permissions
  file: { path: "/workspace/.tazpod/.ssh", owner: tazpod, group: tazpod, mode: '0700' }
