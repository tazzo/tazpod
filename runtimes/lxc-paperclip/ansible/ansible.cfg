[defaults]
# The Paperclip container is an unprivileged LXC on overlayfs: `chmod` has no NFSv4
# ACL support and `setfacl` is not installed, so Ansible's default temp-file strategy
# for an unprivileged `become_user` (the layers run installs and gopass operations as
# the `paperclip` user) cannot work. This is the documented fallback: keep the
# temporary files world-readable instead of ACL-protected.
# Acceptable here because the container is single-tenant and every task that handles a
# secret sets `no_log: true`.
allow_world_readable_tmpfiles = True

# Silence the interpreter-discovery warning inside the container.
interpreter_python = auto_silent

# Keep the output readable in the create.sh phase logs.
stdout_callback = default
