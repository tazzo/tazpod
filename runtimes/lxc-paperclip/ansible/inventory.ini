# CT108 `paperclip` — the agent company's own container, 192.168.1.208/24 on vmbr0.
# The host is listed by address, exactly like the operator container's inventory: the
# address is declared in the runtime's Terraform (`variables.tf`/`terraform.tfvars`,
# mirrored into `configs/runtime.env` as IP_ADDRESS) and repeated here because Ansible
# cannot read Terraform state, and `create.sh` also passes `-e ansible_host=<ip>`, which
# overrides this line — so a re-numbered guest converges without editing two files.
# The layer derives PAPERCLIP_PUBLIC_URL and PAPERCLIP_ALLOWED_HOSTNAMES from the
# address; that is its only use of it. (A named alias would collide with the group name,
# which Ansible warns about, so the address stays the hostname.)
#
# Provisioning key: the operator-owned `/root/.ssh/tazpod-provision` on the trusted
# orchestration host (tazlab, 192.168.1.200), whose authorized_keys entry is pinned
# `restrict,from="192.168.1.200"` (TAZ-12/TAZ-19). It is not the agent's key and it
# never enters the container.
[paperclip]
192.168.1.208 ansible_user=root ansible_ssh_private_key_file=/root/.ssh/tazpod-provision
