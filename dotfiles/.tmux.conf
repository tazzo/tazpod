# === TMUX CONFIG TAZLAB ===
set-option -g default-shell /bin/bash
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "screen-256color"

# Mouse e Indici
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on

# --- FIX SELEZIONE E CLIPBOARD ---
setw -g mode-keys vi

# Abilita il passthrough per sequenze OSC 52 (Fondamentale in Docker)
set -g allow-passthrough on

# Clipboard di sistema via OSC 52
set -as terminal-features ',xterm-256color:clipboard'
set -s set-clipboard on

# Binding VI style
bind-key -T copy-mode-vi Space send-keys -X begin-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# Impedisci al mouse di saltare a fine pagina dopo la selezione
unbind -T copy-mode-vi MouseDragEnd1Pane

# Navigazione finestre con Ctrl+Freccia

# Abilita riconoscimento tasti xterm (fondamentale in Docker)
set -g xterm-keys on
bind-key -n C-Right next-window
bind-key -n C-Left  previous-window

# TPM Plugin Manager (clonato in ~/.tmux/plugins/tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Inizializza TPM (DEVE essere l'ultima riga del file)
run '~/.tmux/plugins/tpm/tpm'
