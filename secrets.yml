# TazPod Secrets Configuration - Ephemeral Castle Edition
config:
  infisical_project_id: "049af2e5-6ec5-4f00-aaf6-e0685ff02801"
  infisical_env: "dev"
  infisical_path: "/ephemeral-castle/tazlab-k8s/proxmox"

secrets:
  - name: GITHUB_TOKEN
    file: github-token
    env: GITHUB_TOKEN

  - name: PROXMOX_TOKEN_ID
    file: proxmox-token-id
    env: PROXMOX_TOKEN_ID

  - name: PROXMOX_TOKEN_SECRET
    file: proxmox-token-secret
    env: PROXMOX_TOKEN_SECRET

  - name: CLOUDFLARE_API_TOKEN
    file: cloudflare-api-token
    env: CLOUDFLARE_API_TOKEN

  - name: TALOS_SECRETBOX_KEY
    file: talos-secretbox-key
    env: TALOS_SECRETBOX_KEY