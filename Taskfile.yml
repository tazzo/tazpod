version: '3'

vars:
  BINARY_NAME: tazpod
  DOCKER_USER: tazzo
  VERSION:
    sh: cat VERSION

tasks:
  build:
    desc: Compile the Go binary for Linux/AMD64
    cmds:
      - 'echo "🔨 Building {{.BINARY_NAME}} {{.VERSION}}..."'
      - 'GOOS=linux GOARCH=amd64 go build -ldflags "-X main.Version={{.VERSION}}" -o bin/{{.BINARY_NAME}} cmd/tazpod/main.go'
      - 'cp bin/{{.BINARY_NAME}} .'

  docker:build:
    desc: Build the entire Docker image hierarchy locally
    deps: [build]
    cmds:
      - 'echo "🏗️  Building Docker layers..."'
      - 'docker build -t {{.DOCKER_USER}}/tazpod-base:latest -f .tazpod/Dockerfile.base .'
      - 'docker build -t {{.DOCKER_USER}}/tazpod-infisical:latest -f .tazpod/Dockerfile.infisical .'
      - 'docker build -t {{.DOCKER_USER}}/tazpod-k8s:latest -f .tazpod/Dockerfile.k8s .'
      - 'docker build -t {{.DOCKER_USER}}/tazpod-gemini:latest -f .tazpod/Dockerfile.gemini .'

  docker:push:
    desc: Push images to registry (prefer GitHub Actions)
    cmds:
      - |
        for layer in tazpod-base tazpod-infisical tazpod-k8s tazpod-gemini; do
          echo "Pushing $layer..."
          docker push "{{.DOCKER_USER}}/$layer:latest"
        done

  release:
    desc: Trigger remote build and release via GitHub
    cmds:
      - 'echo "🚀 Triggering Release {{.VERSION}}..."'
      - 'git add .'
      - 'git commit -m "chore: release {{.VERSION}}" || echo "No changes"'
      - 'git push'
      - 'git tag -a "{{.VERSION}}" -m "Release {{.VERSION}}"'
      - 'git push origin "{{.VERSION}}"'
    prompt: This will trigger a remote build and publish version {{.VERSION}}. Continue?

  clean:
    desc: Cleanup build artifacts
    cmds:
      - 'rm -rf bin/'
      - 'rm -f {{.BINARY_NAME}}'
