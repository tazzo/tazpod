name: Build and Push TazPod Verticals

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build CLI
        run: |
          go build -o tazpod cmd/tazpod/main.go

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "roberto.tazzoli@gmail.com"
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .tazpod/Dockerfile.base
          push: true
          tags: |
            tazzo/tazpod-base:latest
            tazzo/tazpod-base:tazpod-base-${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}

      - name: Build and Push Infisical
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .tazpod/Dockerfile.infisical
          push: true
          tags: |
            tazzo/tazpod-infisical:latest
            tazzo/tazpod-infisical:tazpod-infisical-${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}

      - name: Build and Push K8s
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .tazpod/Dockerfile.k8s
          push: true
          tags: |
            tazzo/tazpod-k8s:latest
            tazzo/tazpod-k8s:tazpod-k8s-${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}

      - name: Build and Push AI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .tazpod/Dockerfile.ai
          push: true
          tags: |
            tazzo/tazpod-ai:latest
            tazzo/tazpod-ai:tazpod-ai-${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}

      - name: Build and Push Gemini
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .tazpod/Dockerfile.gemini
          push: true
          tags: |
            tazzo/tazpod-gemini:latest
            tazzo/tazpod-gemini:tazpod-gemini-${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}
