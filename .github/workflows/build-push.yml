name: Build and Push TazPod Verticals

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      rebuild-ai:
        description: 'Force rebuild of AI layer (opencode, pi, omp)'
        required: false
        default: false
        type: boolean
      rebuild-k8s:
        description: 'Force rebuild of K8s layer'
        required: false
        default: false
        type: boolean
      rebuild-aws:
        description: 'Force rebuild of AWS layer'
        required: false
        default: false
        type: boolean
      rebuild-base:
        description: 'Force rebuild of Base layer'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Check what changed
        id: changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(cmd/|internal/|VERSION)'; then
            echo "cli=true" >> $GITHUB_OUTPUT
          else
            echo "cli=false" >> $GITHUB_OUTPUT
          fi
          echo "any_docker=false" >> $GITHUB_OUTPUT
          echo "base=false" >> $GITHUB_OUTPUT
          echo "aws=false" >> $GITHUB_OUTPUT
          echo "k8s=false" >> $GITHUB_OUTPUT
          echo "ai=false" >> $GITHUB_OUTPUT
          for f in $(git diff --name-only HEAD~1 HEAD); do
            case "$f" in
              .tazpod/Dockerfile.base|dotfiles/*)
                echo "base=true" >> $GITHUB_OUTPUT
                echo "aws=true" >> $GITHUB_OUTPUT
                echo "k8s=true" >> $GITHUB_OUTPUT
                echo "ai=true" >> $GITHUB_OUTPUT
                echo "any_docker=true" >> $GITHUB_OUTPUT
                ;;
              .tazpod/Dockerfile.aws)
                echo "aws=true" >> $GITHUB_OUTPUT
                echo "any_docker=true" >> $GITHUB_OUTPUT
                ;;
              .tazpod/Dockerfile.k8s)
                echo "k8s=true" >> $GITHUB_OUTPUT
                echo "any_docker=true" >> $GITHUB_OUTPUT
                ;;
              .tazpod/Dockerfile.ai)
                echo "ai=true" >> $GITHUB_OUTPUT
                echo "any_docker=true" >> $GITHUB_OUTPUT
                ;;
              cmd/*|internal/*|VERSION)
                # handled by cli=true above
                ;;
            esac
          done

          # Override with workflow_dispatch inputs (manual trigger)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.rebuild-base }}" == "true" ]]; then
              echo "base=true" >> $GITHUB_OUTPUT
              echo "aws=true" >> $GITHUB_OUTPUT
              echo "k8s=true" >> $GITHUB_OUTPUT
              echo "ai=true" >> $GITHUB_OUTPUT
              echo "any_docker=true" >> $GITHUB_OUTPUT
            fi
            if [[ "${{ inputs.rebuild-aws }}" == "true" ]]; then
              echo "aws=true" >> $GITHUB_OUTPUT
              echo "any_docker=true" >> $GITHUB_OUTPUT
            fi
            if [[ "${{ inputs.rebuild-k8s }}" == "true" ]]; then
              echo "k8s=true" >> $GITHUB_OUTPUT
              echo "any_docker=true" >> $GITHUB_OUTPUT
            fi
            if [[ "${{ inputs.rebuild-ai }}" == "true" ]]; then
              echo "ai=true" >> $GITHUB_OUTPUT
              echo "any_docker=true" >> $GITHUB_OUTPUT
            fi
          fi

      # --- CLI BUILD & RELEASE ---

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Read Version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build CLI
        run: |
          VERSION=$(cat VERSION)
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.Version=${VERSION}" -o tazpod ./cmd/tazpod

      - name: Publish GitHub Release
        if: steps.changed.outputs.cli == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION)
          gh release delete "${VERSION}" --yes 2>/dev/null || true
          gh release create "${VERSION}" tazpod \
            --title "TazPod ${VERSION}" \
            --notes "Automated release from CI" \
            --latest

      # --- DOCKER BUILD & PUSH (per-layer, only changed Dockerfiles) ---

      - name: Login to Docker Hub
        if: steps.changed.outputs.any_docker == 'true'
        uses: docker/login-action@v4
        with:
          username: "roberto.tazzoli@gmail.com"
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.changed.outputs.any_docker == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Base
        if: steps.changed.outputs.base == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .tazpod/Dockerfile.base
          push: true
          tags: |
            tazzo/tazpod-base:latest
            tazzo/tazpod-base:tazpod-base-${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=tazpod-base
          cache-to: type=gha,mode=max,scope=tazpod-base

      - name: Build and Push AWS
        if: steps.changed.outputs.aws == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .tazpod/Dockerfile.aws
          push: true
          build-args: BASE_VERSION=latest
          tags: |
            tazzo/tazpod-aws:latest
            tazzo/tazpod-aws:${{ env.VERSION }}
            tazzo/tazpod-aws:tazpod-aws-${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=tazpod-aws
          cache-to: type=gha,mode=max,scope=tazpod-aws

      - name: Build and Push K8s
        if: steps.changed.outputs.k8s == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .tazpod/Dockerfile.k8s
          push: true
          build-args: BASE_VERSION=latest
          tags: |
            tazzo/tazpod-k8s:latest
            tazzo/tazpod-k8s:${{ env.VERSION }}
            tazzo/tazpod-k8s:tazpod-k8s-${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=tazpod-k8s
          cache-to: type=gha,mode=max,scope=tazpod-k8s

      - name: Build and Push AI
        if: steps.changed.outputs.ai == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .tazpod/Dockerfile.ai
          push: true
          build-args: BASE_VERSION=latest
          tags: |
            tazzo/tazpod-ai:latest
            tazzo/tazpod-ai:${{ env.VERSION }}
            tazzo/tazpod-ai:tazpod-ai-${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=tazpod-ai
          cache-to: type=gha,mode=max,scope=tazpod-ai
