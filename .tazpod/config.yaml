# TazPod Configuration
version: 1.0

# Final Image
image: "tazzo/tazpod-ai:latest"

# Container Settings
container_name: "tazpod-lab"
user: "tazpod"

# Build Settings (Build AI layer locally)
build:
  dockerfile: ".tazpod/Dockerfile.ai"
  context: "."

# Features
features:
  ghost_mode: true
  debug: false
